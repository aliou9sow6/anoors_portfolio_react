###############################################################
# Grafana — Configuration du provider de dashboards
# Grafana surveille le dossier /var/lib/grafana/dashboards
# et charge automatiquement tout fichier .json trouvé
###############################################################

apiVersion: 1

providers:
  - name: 'Portfolio Dashboards'
    orgId: 1
    folder: 'Portfolio'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
