###############################################################
# Grafana — Datasource Prometheus (provisionnée automatiquement)
# Grafana charge ce fichier au démarrage, pas besoin de cliquer
###############################################################

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: "POST"
