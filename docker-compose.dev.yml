services:
  # Backend en mode développement
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: portfolio_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/portfolio_db?authSource=admin
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - portfolio_network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Frontend en mode développement
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: portfolio_frontend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - portfolio_network
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    command: npm start
