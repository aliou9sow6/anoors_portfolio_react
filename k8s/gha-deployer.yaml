apiVersion: v1
kind: ServiceAccount
metadata:
  name: gha-deployer
  namespace: portfolio

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-deployer-role
  namespace: portfolio
rules:
- apiGroups: ["", "apps", "batch"]
  resources: ["pods", "services", "configmaps", "secrets", "deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gha-deployer-binding
  namespace: portfolio
subjects:
- kind: ServiceAccount
  name: gha-deployer
  namespace: portfolio
roleRef:
  kind: Role
  name: gha-deployer-role
  apiGroup: rbac.authorization.k8s.io
