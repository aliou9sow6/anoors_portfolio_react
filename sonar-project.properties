# SonarQube configuration file for the Portfolio React project
# This file is used by SonarQube to analyze the code quality of the project.

# Project identification and general settings
sonar.projectKey=anoors_portfolio_react
sonar.projectName=anoors_portfolio_react
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8 

# Configuration des sources et des exclusions
sonar.sources=src,backend
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/backend/node_modules/**,**/backend/packages/**

# Configuration pour les tests unitaires et la couverture de code
sonar.javascript.lcov.reportPaths=coverage/lcov.info